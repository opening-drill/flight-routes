[paths]
# Colon-separated dirs added to sys.path (relative to repo root). Default includes redis/db.
# Colon-separated; "." is the repo root (for flightRouteCalculator.py)
pythonpath = src/services/redis/db:.

[kafka]
properties_file = kafkaAccess/client.properties
topic = events
group_id = flight-routes-new-impl
auto_offset_reset = earliest

[redis]
host = 127.0.0.1
port = 6379
db = 0

[monitor]
interval_seconds = 30

[planner]
safety_buffer_meters = 1.0

[api]
core_base_url = https://core-service-1015949672422.europe-west1.run.app
# Full URL override (optional); default is {core_base_url}/api/polygons
polygons_url = https://core-service-1015949672422.europe-west1.run.app/api/polygons
api_key = adminkey123456789
